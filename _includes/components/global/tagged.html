{% if tags %}
<div class="componenth3 tagged">
  <h3>Recipe Tags</h3>
  <div class="tag">
  <ul>
{% for tag in tags %}
  {%- if tag != "post" -%}
    {% set tagUrl %}/tagged/{{ tag | safeSlug }}/{% endset %}
   <li class="taggs"><a href="{{ tagUrl | url }}" rel="tag" title="{{ tag }}" alt="{{ tag }}">{{ tag }}</a></li>
  {%- endif -%}
{% endfor %}
  </ul>
</div>
</div>
{% endif %}
